name: Probe deployed Worker production

on:
  push:
    branches:
      - deploy/zero-base-once
    paths:
      - .github/workflows/deploy-worker.yml

permissions:
  contents: write

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

env:
  WORKER_BASE_URL: https://radar.max-yu.workers.dev

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Measure production endpoints
        run: node scripts/probe-zero-base-postdeploy.mjs > postdeploy-result.txt && cat postdeploy-result.txt

      - name: Record probe result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- postdeploy-result.txt
          git commit -m "Record final zero-base post-deploy latency probe" || true
          git push

      - name: Assert probe success
        run: grep -q '"allOk": true' postdeploy-result.txt
