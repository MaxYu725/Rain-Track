name: Deploy Worker production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-worker.yml'
      - 'wrangler.jsonc'
      - 'worker.js'
      - 'worker-entry.js'
      - 'swirls-data.js'
      - 'swirls-worker-runtime.js'
      - 'swirls-point-series.js'
      - 'swirls-snapshot.js'
      - 'scripts/smoke-worker-production.mjs'
      - 'scripts/validate-swirls-snapshot.mjs'

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

env:
  WORKER_BASE_URL: https://radar.max-yu.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main source
        uses: actions/checkout@v6

      - name: Validate deployable Worker source
        run: |
          node --check worker.js
          node --check worker-entry.js
          node --check swirls-point-series.js
          node --check swirls-snapshot.js
          node --check scripts/smoke-worker-production.mjs
          node --check scripts/validate-swirls-snapshot.mjs
          node scripts/validate-worker-swirls-inline.mjs
          node scripts/validate-swirls-point-series.mjs
          node scripts/validate-swirls-snapshot.mjs

      - name: Deploy production Worker with snapshot KV and cron
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: |
            deploy --config wrangler.jsonc --keep-vars --dry-run
            deploy --config wrangler.jsonc --keep-vars
            deployments status --name radar --json

      - name: Smoke production Worker
        run: node scripts/smoke-worker-production.mjs
