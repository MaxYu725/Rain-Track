name: Deploy Worker production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

env:
  WORKER_BASE_URL: https://radar.max-yu.workers.dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main source
        uses: actions/checkout@v6

      - name: Validate deployable Worker source
        run: |
          node --check worker.js
          node --check worker-phase3c-v2.js
          node --check swirls-point-sample.js
          node --check swirls-point-request.js
          node --check swirls-point-series-request.js
          node --check swirls-point-series-batch.js
          node --check scripts/smoke-worker-production.mjs
          node --check scripts/probe-swirls-point-production.mjs
          node --check scripts/probe-swirls-point-series-production.mjs
          node scripts/validate-swirls-point-sample.mjs
          node scripts/validate-swirls-point-request.mjs
          node scripts/validate-swirls-point-series-request.mjs
          node scripts/validate-phase3c-v2-worker.mjs
          node scripts/validate-worker-swirls-inline.mjs

      - name: Dry run and deploy production Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: |
            deploy worker-phase3c-v2.js --name radar --compatibility-date 2026-08-05 --keep-vars --dry-run
            deploy worker-phase3c-v2.js --name radar --compatibility-date 2026-08-05 --keep-vars
            deployments status --name radar --json

      - name: Smoke stable production routes
        run: node scripts/smoke-worker-production.mjs

      - name: Smoke compact SWIRLS point endpoint
        run: node scripts/probe-swirls-point-production.mjs

      - name: Smoke SWIRLS point-series endpoint
        run: node scripts/probe-swirls-point-series-production.mjs
