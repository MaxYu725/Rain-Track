name: Diagnose HKO radar source

on:
  push:
    branches:
      - feature/worker-v2.4.2-live-source

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify current HKO radar image paths
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.hko.gov.hk/wxinfo/radars/temp_json/nradar_img.json'
          curl -fsSL --compressed -A 'Mozilla/5.0' "$base?$(date +%s)" -o /tmp/nradar_img.json
          python - <<'PY'
          import json, re, urllib.parse, urllib.request
          data=json.load(open('/tmp/nradar_img.json'))
          root='https://www.hko.gov.hk/wxinfo/radars/'
          for key in ('range0','range2','range3'):
              items=data.get('radar',{}).get(key,{}).get('image',[])
              print('\n',key,'count=',len(items))
              for item in items[-3:]:
                  m=re.search(r'["\']([^"\']+\.(?:jpg|jpeg|png|gif|webp))["\']', item, re.I)
                  if not m:
                      print('PARSE FAIL',item); continue
                  path=m.group(1)
                  url=urllib.parse.urljoin(root,path)
                  print('IMAGE',url)
                  try:
                      req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0','Range':'bytes=0-63'})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          body=r.read(64)
                          print('  status',r.status,'type',r.headers.get('content-type'),'last-modified',r.headers.get('last-modified'),'bytes-read',len(body),'magic',body[:12].hex())
                  except Exception as e:
                      print('  GET ERR',e)
          PY
