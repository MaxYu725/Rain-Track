name: Diagnose HKO radar source

on:
  push:
    branches:
      - feature/worker-v2.4.2-live-source

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current HKO radar JSON
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.hko.gov.hk/wxinfo/radars/temp_json/nradar_img.json'
          echo '===== CURRENT JSON ====='
          curl -fsSL --compressed -A 'Mozilla/5.0' "$base?$(date +%s)" -o /tmp/nradar_img.json
          python -m json.tool /tmp/nradar_img.json
          echo '===== IMAGE HEAD CHECKS ====='
          python - <<'PY'
          import json, urllib.parse, urllib.request
          data=json.load(open('/tmp/nradar_img.json'))
          root='https://www.hko.gov.hk/wxinfo/radars/'
          for key in ('range0','range1','range2'):
              block=data.get('radar',{}).get(key,{})
              imgs=block.get('image',[])
              print('\n',key,'count=',len(imgs),'meta=',{k:v for k,v in block.items() if k!='image'})
              for item in imgs[-3:]:
                  value=item if isinstance(item,str) else str(item)
                  url=urllib.parse.urljoin(root,value)
                  print('IMAGE',url)
                  try:
                      req=urllib.request.Request(url, method='HEAD', headers={'User-Agent':'Mozilla/5.0'})
                      with urllib.request.urlopen(req, timeout=15) as r:
                          print('  status',r.status,'type',r.headers.get('content-type'),'last-modified',r.headers.get('last-modified'),'length',r.headers.get('content-length'))
                  except Exception as e:
                      print('  HEAD ERR',e)
          PY
