name: Diagnose HKO radar source

on:
  push:
    branches:
      - feature/worker-v2.4.2-live-source

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current HKO radar pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hko
          pages=(
            "https://www.hko.gov.hk/en/wxinfo/radars/radar_range1.htm?pv_mode=playback"
            "https://www.hko.gov.hk/en/wxinfo/radars/radar.htm?pv_mode=playback"
            "https://www.hko.gov.hk/en/wxinfo/awsgis/regional_weather_gis.html"
            "https://www.hko.gov.hk/en/wxinfo/ts/index_wind.htm"
          )
          i=0
          for page in "${pages[@]}"; do
            i=$((i+1))
            echo "===== PAGE $i: $page ====="
            curl -fsSL --compressed -A 'Mozilla/5.0' "$page" -o "/tmp/hko/page$i.html"
            echo "-- script src --"
            grep -Eo '<script[^>]+src=["'"'][^"'"']+' "/tmp/hko/page$i.html" | sed -E 's/.*src=["'"']//g' || true
            echo "-- radar/image/ajax hints --"
            grep -Eio '.{0,120}(radar|\.png|\.gif|\.jpg|\.jpeg|\.webp|ajax|json|wms|tile|image)[^<]{0,180}' "/tmp/hko/page$i.html" | head -n 120 || true
          done

          echo "===== DOWNLOAD SAME-HOST JS FROM RADAR PAGE ====="
          python - <<'PY'
          import re, urllib.parse, urllib.request, pathlib
          base='https://www.hko.gov.hk/en/wxinfo/radars/radar_range1.htm?pv_mode=playback'
          html=pathlib.Path('/tmp/hko/page1.html').read_text(errors='ignore')
          srcs=re.findall(r'<script[^>]+src=["\']([^"\']+)', html, re.I)
          for idx, src in enumerate(srcs):
              url=urllib.parse.urljoin(base, src)
              if urllib.parse.urlparse(url).hostname not in {'www.hko.gov.hk','www.weather.gov.hk'}:
                  continue
              print('JS', url)
              try:
                  req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
                  text=urllib.request.urlopen(req, timeout=15).read().decode('utf-8','ignore')
              except Exception as e:
                  print('ERR', e); continue
              hits=[]
              for line in text.splitlines():
                  if re.search(r'radar|\.png|\.gif|\.jpg|ajax|json|image', line, re.I):
                      hits.append(line[:900])
              for line in hits[:160]:
                  print(line)
          PY
