name: Validate radar build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check worker-phase3c-v2.js
          node --check swirls-data.js
          node --check swirls-point-sample.js
          node --check swirls-point-request.js
          node --check swirls-point-series-request.js
          node --check swirls-point-series-batch.js
          node --check swirls-worker-runtime.js
          node --check service-worker.js
          for file in js/*.js; do
            node --check "$file"
          done
          node --check scripts/validate-app-shell.mjs
          node --check scripts/validate-boot-resilience.mjs
          node --check scripts/validate-rain-home-first-paint.mjs
          node --check scripts/validate-forecast-map-contract.mjs
          node --check scripts/validate-swirls-contract.mjs
          node --check scripts/validate-swirls-point-sample.mjs
          node --check scripts/validate-swirls-point-request.mjs
          node --check scripts/validate-swirls-point-series-request.mjs
          node --check scripts/validate-phase3c-v2-worker.mjs
          node --check scripts/validate-swirls-runtime.mjs
          node --check scripts/validate-worker-swirls-inline.mjs
          node --check scripts/validate-swirls-frontend.mjs
          node --check scripts/probe-swirls-frontend-live.mjs
          node --check scripts/probe-swirls-point-production.mjs
          node --check scripts/probe-swirls-point-series-production.mjs
          node --check scripts/benchmark-swirls-series.mjs
          node --check scripts/validate-forecast-playback-settings.mjs
          node --check scripts/validate-radar-playback-v2.mjs
          node --check scripts/validate-radar-analysis-v1.mjs
          node --check scripts/validate-rain-home.mjs
          node --check scripts/validate-rain-home-chart-intensity.mjs
          node --check scripts/validate-rain-map-quickviews.mjs
          node --check scripts/validate-rain-home-point-explorer.mjs
          node --check scripts/validate-rain-home-time-axis.mjs
          node --check scripts/validate-forecast-rain-area-summary.mjs
          node --check scripts/validate-forecast-rain-motion.mjs
          node --check scripts/validate-forecast-context-analysis.mjs
      - name: Validate PWA app shell
        run: node scripts/validate-app-shell.mjs
      - name: Validate frontend boot resilience
        run: node scripts/validate-boot-resilience.mjs
      - name: Validate Rain Home first paint
        run: node scripts/validate-rain-home-first-paint.mjs
      - name: Validate forecast map contract
        run: node scripts/validate-forecast-map-contract.mjs
      - name: Validate SWIRLS raw feed contract
        run: node scripts/validate-swirls-contract.mjs
      - name: Validate SWIRLS single-frame point sample
        run: node scripts/validate-swirls-point-sample.mjs
      - name: Validate SWIRLS single-frame point request
        run: node scripts/validate-swirls-point-request.mjs
      - name: Validate SWIRLS 16-point series request
        run: node scripts/validate-swirls-point-series-request.mjs
      - name: Validate compact SWIRLS Worker entry
        run: node scripts/validate-phase3c-v2-worker.mjs
      - name: Validate SWIRLS live fetch runtime
        run: node scripts/validate-swirls-runtime.mjs
      - name: Validate inline SWIRLS Worker parity
        run: node scripts/validate-worker-swirls-inline.mjs
      - name: Validate SWIRLS frontend 6-minute forecast
        run: node scripts/validate-swirls-frontend.mjs
      - name: Validate forecast playback and separated settings
        run: node scripts/validate-forecast-playback-settings.mjs
      - name: Validate Radar commit-based playback and direct controls
        run: node scripts/validate-radar-playback-v2.mjs
      - name: Validate Radar client-side analysis
        run: node scripts/validate-radar-analysis-v1.mjs
      - name: Validate Rain Home location-first UI
        run: node scripts/validate-rain-home.mjs
      - name: Validate Rain Home chart intensity and horizontal explorer
        run: node scripts/validate-rain-home-chart-intensity.mjs
      - name: Validate forecast map quick views
        run: node scripts/validate-rain-map-quickviews.mjs
      - name: Validate Rain Home 16-point explorer
        run: node scripts/validate-rain-home-point-explorer.mjs
      - name: Validate Rain Home true time axis
        run: node scripts/validate-rain-home-time-axis.mjs
      - name: Validate forecast rain-area summary
        run: node scripts/validate-forecast-rain-area-summary.mjs
      - name: Validate forecast rain-area motion insight
        run: node scripts/validate-forecast-rain-motion.mjs
      - name: Validate context-aware Forecast Map analysis
        run: node scripts/validate-forecast-context-analysis.mjs
      - name: Benchmark SWIRLS zero-base series path
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/benchmark-swirls-series.mjs
      # This checks the already-deployed Worker, not the PR under test. Keep it
      # informational on main; deploy-worker.yml owns blocking production smoke.
      - name: Probe current production SWIRLS frontend contract
        if: github.event_name == 'push'
        continue-on-error: true
        run: node scripts/probe-swirls-frontend-live.mjs
