name: Validate radar build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check worker.js
          node --check worker-phase3c-v2.js
          node --check swirls-data.js
          node --check swirls-point-sample.js
          node --check swirls-point-request.js
          node --check swirls-worker-runtime.js
          node --check service-worker.js
          for file in js/*.js; do
            node --check "$file"
          done
          node --check scripts/validate-app-shell.mjs
          node --check scripts/validate-forecast-map-contract.mjs
          node --check scripts/validate-swirls-contract.mjs
          node --check scripts/validate-swirls-point-sample.mjs
          node --check scripts/validate-swirls-point-request.mjs
          node --check scripts/validate-phase3c-v2-worker.mjs
          node --check scripts/validate-swirls-runtime.mjs
          node --check scripts/validate-worker-swirls-inline.mjs
          node --check scripts/validate-swirls-frontend.mjs
          node --check scripts/probe-swirls-frontend-live.mjs
          node --check scripts/probe-swirls-point-production.mjs
          node --check scripts/validate-forecast-playback-settings.mjs
      - name: Validate PWA app shell
        run: node scripts/validate-app-shell.mjs
      - name: Validate forecast map contract
        run: node scripts/validate-forecast-map-contract.mjs
      - name: Validate SWIRLS raw feed contract
        run: node scripts/validate-swirls-contract.mjs
      - name: Validate SWIRLS single-frame point sample
        run: node scripts/validate-swirls-point-sample.mjs
      - name: Validate SWIRLS single-frame point request
        run: node scripts/validate-swirls-point-request.mjs
      - name: Validate isolated Phase 3C v2 Worker entry
        run: node scripts/validate-phase3c-v2-worker.mjs
      - name: Validate SWIRLS live fetch runtime
        run: node scripts/validate-swirls-runtime.mjs
      - name: Validate inline SWIRLS Worker parity
        run: node scripts/validate-worker-swirls-inline.mjs
      - name: Validate SWIRLS frontend 6-minute forecast
        run: node scripts/validate-swirls-frontend.mjs
      - name: Validate forecast playback and separated settings
        run: node scripts/validate-forecast-playback-settings.mjs
      - name: Probe live SWIRLS frontend contract
        run: node scripts/probe-swirls-frontend-live.mjs

  phase3c-v2-production-verify:
    if: github.event_name == 'pull_request' && github.head_ref == 'phase3c-v2/single-frame-point-endpoint'
    needs: syntax
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-worker-production
      cancel-in-progress: false
    env:
      CANARY_BASE_URL: https://radar-phase3c-v2.max-yu.workers.dev
      PROD_BASE_URL: https://radar.max-yu.workers.dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy isolated canary Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: |
            deploy worker-phase3c-v2.js --name radar-phase3c-v2 --compatibility-date 2026-08-05 --keep-vars --dry-run
            deploy worker-phase3c-v2.js --name radar-phase3c-v2 --compatibility-date 2026-08-05 --keep-vars
            deployments status --name radar-phase3c-v2 --json

      - name: Smoke Stable Recovery routes on canary
        env:
          WORKER_BASE_URL: ${{ env.CANARY_BASE_URL }}
        run: node scripts/smoke-worker-production.mjs

      - name: Verify compact point endpoint on canary
        env:
          WORKER_BASE_URL: ${{ env.CANARY_BASE_URL }}
        run: node scripts/probe-swirls-point-production.mjs

      - name: Promote verified bundle to production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: |
            deploy worker-phase3c-v2.js --name radar --compatibility-date 2026-08-05 --keep-vars --dry-run
            deploy worker-phase3c-v2.js --name radar --compatibility-date 2026-08-05 --keep-vars
            deployments status --name radar --json

      - name: Smoke Stable Recovery routes after production promotion
        env:
          WORKER_BASE_URL: ${{ env.PROD_BASE_URL }}
        run: node scripts/smoke-worker-production.mjs

      - name: Verify compact point endpoint in production
        env:
          WORKER_BASE_URL: ${{ env.PROD_BASE_URL }}
        run: node scripts/probe-swirls-point-production.mjs

      - name: Verify Recovery bindings remain absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/radar'

          def get(path):
              request = urllib.request.Request(
                  base + path,
                  headers={'Authorization': f'Bearer {token}', 'User-Agent': 'Rain-Track-phase3c-v2-verify/1.0'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              assert payload.get('success') is True, payload.get('errors')
              return payload.get('result')

          schedules = get('/schedules') or []
          if isinstance(schedules, dict):
              schedules = schedules.get('schedules', [])
          assert schedules == [], f'Expected no Worker Cron triggers, got {schedules!r}'

          settings = get('/settings') or {}
          bindings = settings.get('bindings', []) if isinstance(settings, dict) else []
          names = sorted(binding.get('name') for binding in bindings if isinstance(binding, dict) and binding.get('name'))
          assert 'SWIRLS_SNAPSHOTS' not in names, f'Experimental KV binding returned: {names!r}'
          print('PASS production Cron triggers: 0')
          print('PASS SWIRLS_SNAPSHOTS binding absent')
          PY

      - name: Remove temporary canary Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers/scripts/radar-phase3c-v2"
          request = urllib.request.Request(
              url,
              method='DELETE',
              headers={'Authorization': f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}", 'User-Agent': 'Rain-Track-phase3c-v2-cleanup/1.0'},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get('success') is not True:
                  print('Canary cleanup warning:', payload.get('errors'))
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  print('Canary cleanup warning: HTTP', error.code)
          PY
