name: Verify Worker production

on:
  push:
    branches:
      - chore/worker-deploy-pipeline
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-worker-production
  cancel-in-progress: false

env:
  WORKER_BASE_URL: https://radar.max-yu.workers.dev
  EXPECTED_WORKER_VERSION: 2.5.0

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Syntax check production smoke
        run: node --check scripts/smoke-worker-production.mjs

      - name: Verify Cloudflare deployment credentials
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami

      - name: Smoke production Worker
        run: node scripts/smoke-worker-production.mjs
