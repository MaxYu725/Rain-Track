name: Discover HKO GIS radar layer

on:
  push:
    branches:
      - feature/v1.6.2-radar-rendering-fix

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Inspect HKO Regional Portal network
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1280,height:900}});
            const hits = new Set();
            const all = new Set();
            const remember = url => {
              all.add(url);
              if (/radar|wms|arcgis|layer|rain|png|jpe?g|gif|json/i.test(url)) hits.add(url);
            };
            page.on('request', req => remember(req.url()));
            page.on('response', res => remember(res.url()));
            await page.goto('https://www.hko.gov.hk/en/wxinfo/awsgis/regional_portal.html', {waitUntil:'networkidle', timeout:60000});
            await page.waitForTimeout(4000);
            const inputs = await page.locator('input').evaluateAll(nodes => nodes.map((el,i)=>({i,type:el.type,id:el.id,name:el.name,value:el.value,checked:el.checked,outer:el.outerHTML.slice(0,300)})));
            console.log('INPUTS', JSON.stringify(inputs,null,2));
            const radarText = await page.locator('body').innerText().catch(()=> '');
            console.log('HAS RADAR TEXT', radarText.includes('Radar'));
            // Try likely radar controls without depending on one portal revision.
            for (const selector of ['#radar','input[name*=radar i]','input[id*=radar i]','[data-layer*=radar i]']) {
              const loc = page.locator(selector).first();
              if (await loc.count()) {
                try { await loc.click({force:true}); await page.waitForTimeout(5000); } catch {}
              }
            }
            const scripts = await page.locator('script[src]').evaluateAll(nodes => nodes.map(el => el.src));
            console.log('SCRIPTS', JSON.stringify(scripts,null,2));
            for (const src of scripts) {
              try {
                const text = await page.evaluate(async url => await (await fetch(url)).text(), src);
                if (/radar/i.test(text)) {
                  console.log('RADAR_SCRIPT', src);
                  const lines = text.split(/\n/).filter(line => /radar|wms|arcgis|tile|image/i.test(line)).slice(0,160);
                  console.log(lines.join('\n'));
                }
              } catch (e) { console.log('SCRIPT_FETCH_FAIL', src, String(e)); }
            }
            console.log('NETWORK_HITS_START');
            [...hits].sort().forEach(url => console.log(url));
            console.log('NETWORK_HITS_END');
            await page.screenshot({path:'hko-regional-portal.png',fullPage:true});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hko-radar-layer-discovery
          path: hko-regional-portal.png
          retention-days: 2
