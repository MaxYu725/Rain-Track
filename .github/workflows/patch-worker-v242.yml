name: Patch Worker v2.4.2 live radar source

on:
  push:
    branches:
      - feature/worker-v2.4.2-live-source

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'apply Worker v2.4.2 live source') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/worker-v2.4.2-live-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch worker.js
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('worker.js')
          text = path.read_text()

          text = text.replace('Hong Kong Point Rainfall Forecast Worker v2.4.1', 'Hong Kong Point Rainfall Forecast Worker v2.4.2', 1)
          text = text.replace("const VERSION = '2.4.1';", "const VERSION = '2.4.2';", 1)
          text = text.replace("Mozilla/5.0 (compatible; HK-Point-Rain-Worker/2.4.1)", "Mozilla/5.0 (compatible; HK-Point-Rain-Worker/2.4.2)", 1)
          text = text.replace('const RADAR_CACHE_TTL_SECONDS = 180;', 'const RADAR_CACHE_TTL_SECONDS = 60;', 1)
          text = text.replace(
              'const RADAR_LIVE_MAX_FUTURE_MINUTES = 10;',
              "const RADAR_LIVE_MAX_FUTURE_MINUTES = 10;\nconst RADAR_LIVE_HISTORY_MINUTES = 150;\nconst HKO_RADAR_INDEX = 'https://www.hko.gov.hk/wxinfo/radars/temp_json/nradar_img.json';\nconst HKO_RADAR_IMAGE_ROOT = 'https://www.hko.gov.hk/wxinfo/radars/';",
              1
          )

          old_radar = '''const RADAR = Object.freeze({
            64: {
              root: 'https://www.hko.gov.hk/wxinfo/radars/radar_064_kml/Radar_064.kml',
              fallbackBounds: { north: 22.89, south: 21.72, east: 114.82, west: 113.53 }
            },
            256: {
              root: 'https://www.hko.gov.hk/wxinfo/radars/radar_256_kml/Radar_256.kml',
              fallbackBounds: { north: 24.61, south: 19.99, east: 116.67, west: 111.68 }
            }
          });'''
          new_radar = '''const RADAR = Object.freeze({
            64: {
              feedKey: 'range2',
              pathPrefix: 'rad_064_png/',
              product: '64 km range, 3 km height',
              legacyKmlRoot: 'https://www.hko.gov.hk/wxinfo/radars/radar_064_kml/Radar_064.kml',
              fallbackBounds: { north: 22.89, south: 21.72, east: 114.82, west: 113.53 }
            },
            256: {
              feedKey: 'range0',
              pathPrefix: 'rad_256_png/',
              product: '256 km range, 3 km height',
              legacyKmlRoot: 'https://www.hko.gov.hk/wxinfo/radars/radar_256_kml/Radar_256.kml',
              fallbackBounds: { north: 24.61, south: 19.99, east: 116.67, west: 111.68 }
            }
          });'''
          if old_radar not in text:
              raise SystemExit('RADAR config block not found')
          text = text.replace(old_radar, new_radar, 1)

          start = text.index('async function handleRadarFrames(range, mode, probe) {')
          end = text.index('function handleTestRadarFrames(range, probe) {', start)
          new_live = r'''async function handleRadarFrames(range, mode, probe) {
            if (mode === 'test') return handleTestRadarFrames(range, probe);

            const source = RADAR[range];
            const diagnostics = {
              attempts: [], errors: [], rejected: [],
              policy: `Current HKO radar JSON; latest frame <= ${RADAR_LIVE_MAX_AGE_MINUTES} min old; history <= ${RADAR_LIVE_HISTORY_MINUTES} min`,
              mode: 'live',
              feedKey: source.feedKey,
              product: source.product,
              legacyKml: { root: source.legacyKmlRoot, status: 'deprecated-not-queried' }
            };
            let frames = [];
            try {
              frames = await collectCurrentRadarFrames(source, range, diagnostics);
            } catch (error) {
              diagnostics.errors.push(safeError(error));
            }

            frames = validateCurrentRadarFrames(dedupeFrames(frames), diagnostics).slice(-RADAR_MAX_FRAMES);
            const issueTime = frames.at(-1)?.time || null;
            const payload = {
              ok: frames.length > 0,
              version: VERSION,
              contractVersion: RADAR_CONTRACT.version,
              rangeKm: range,
              mode: 'live',
              source: 'Hong Kong Observatory current radar image index',
              root: HKO_RADAR_INDEX,
              product: source.product,
              generatedAt: new Date().toISOString(),
              issueTime,
              cadenceMinutes: RADAR_CADENCE_MINUTES,
              frameCount: frames.length,
              error: frames.length ? null : 'HKO live radar source is stale or unavailable',
              frames: frames.map((frame, index) => ({
                id: encodeUrl(frame.href),
                index,
                time: frame.time,
                name: frame.name || `Radar ${index + 1}`,
                bounds: frame.bounds || source.fallbackBounds,
                source: frame.source,
                timeSource: frame.timeSource || null,
                rawTime: probe ? (frame.rawTime || null) : undefined,
                imageUrl: `/api/radar/image?id=${encodeURIComponent(encodeUrl(frame.href))}`
              }))
            };

            if (probe) {
              payload.diagnostics = diagnostics;
              return json(payload, 200, { 'Cache-Control': 'no-store' });
            }

            return json(payload, frames.length ? 200 : 502, { 'Cache-Control': `public, max-age=${RADAR_CACHE_TTL_SECONDS}` });
          }

          async function collectCurrentRadarFrames(source, range, diagnostics) {
            const response = await fetchCached(HKO_RADAR_INDEX, RADAR_CACHE_TTL_SECONDS, 'application/json,text/plain,*/*');
            const text = await response.text();
            diagnostics.attempts.push({
              url: HKO_RADAR_INDEX,
              status: response.status,
              bytes: text.length,
              lastModified: response.headers.get('last-modified'),
              date: response.headers.get('date')
            });

            let data;
            try {
              data = JSON.parse(text);
            } catch {
              throw new Error('HKO radar index returned invalid JSON');
            }

            const items = data?.radar?.[source.feedKey]?.image;
            if (!Array.isArray(items) || !items.length) {
              throw new Error(`HKO radar index has no ${source.feedKey} image list`);
            }

            diagnostics.index = {
              feedKey: source.feedKey,
              inputCount: items.length,
              pathPrefix: source.pathPrefix
            };

            const frames = [];
            for (const item of items) {
              const relativePath = extractCurrentRadarPath(item);
              if (!relativePath) {
                diagnostics.rejected.push({ raw: String(item).slice(0, 180), reason: 'unparseable-index-entry' });
                continue;
              }
              if (!relativePath.startsWith(source.pathPrefix)) {
                diagnostics.rejected.push({ raw: relativePath, reason: 'unexpected-product-path' });
                continue;
              }

              const href = resolveUrl(relativePath, HKO_RADAR_IMAGE_ROOT);
              if (!isAllowedRadarImage(href)) {
                diagnostics.rejected.push({ raw: relativePath, reason: 'image-url-not-allowed' });
                continue;
              }

              const time = parseTimeFromText(relativePath);
              if (!time) {
                diagnostics.rejected.push({ raw: relativePath, reason: 'missing-time-in-filename' });
                continue;
              }

              frames.push({
                href,
                bounds: source.fallbackBounds,
                name: `${range} km radar`,
                time,
                rawTime: relativePath,
                timeSource: 'filename-hkt',
                source: 'hko-current-json'
              });
            }
            return frames;
          }

          function extractCurrentRadarPath(value) {
            const match = String(value || '').match(/["']([^"']+\.(?:png|gif|jpe?g|webp))["']/i);
            return match ? match[1].trim() : null;
          }

          function validateCurrentRadarFrames(frames, diagnostics) {
            const nowMs = Date.now();
            const maxLatestPastMs = RADAR_LIVE_MAX_AGE_MINUTES * 60 * 1000;
            const maxHistoryMs = RADAR_LIVE_HISTORY_MINUTES * 60 * 1000;
            const maxFutureMs = RADAR_LIVE_MAX_FUTURE_MINUTES * 60 * 1000;
            const timed = frames
              .map(frame => ({ frame, ms: Date.parse(frame.time || '') }))
              .filter(item => Number.isFinite(item.ms))
              .sort((a, b) => a.ms - b.ms);

            const latestMs = timed.at(-1)?.ms;
            const latestFresh = Number.isFinite(latestMs)
              && latestMs >= nowMs - maxLatestPastMs
              && latestMs <= nowMs + maxFutureMs;

            diagnostics.sourceFreshness = {
              latestFrameTime: Number.isFinite(latestMs) ? new Date(latestMs).toISOString() : null,
              latestAgeMinutes: Number.isFinite(latestMs) ? Math.round((nowMs - latestMs) / 60000) : null,
              latestFresh,
              liveMaxAgeMinutes: RADAR_LIVE_MAX_AGE_MINUTES,
              historyMaxAgeMinutes: RADAR_LIVE_HISTORY_MINUTES,
              liveMaxFutureMinutes: RADAR_LIVE_MAX_FUTURE_MINUTES
            };

            if (!latestFresh) {
              for (const { frame, ms } of timed) {
                diagnostics.rejected.push({
                  href: frame.href,
                  rawTime: frame.time,
                  ageMinutes: Math.round((nowMs - ms) / 60000),
                  reason: 'stale-live-feed-latest-frame'
                });
              }
              diagnostics.validation = {
                inputCount: frames.length,
                acceptedCount: 0,
                rejectedCount: diagnostics.rejected.length,
                referenceTime: new Date(nowMs).toISOString(),
                latestFrameTime: Number.isFinite(latestMs) ? new Date(latestMs).toISOString() : null
              };
              return [];
            }

            const accepted = [];
            for (const { frame, ms } of timed) {
              if (ms < nowMs - maxHistoryMs || ms > nowMs + maxFutureMs) {
                diagnostics.rejected.push({
                  href: frame.href,
                  rawTime: frame.time,
                  ageMinutes: Math.round((nowMs - ms) / 60000),
                  reason: 'outside-live-animation-window'
                });
                continue;
              }
              accepted.push(frame);
            }

            diagnostics.validation = {
              inputCount: frames.length,
              acceptedCount: accepted.length,
              rejectedCount: diagnostics.rejected.length,
              referenceTime: new Date(nowMs).toISOString(),
              latestFrameTime: new Date(latestMs).toISOString(),
              freshnessWindowMinutes: RADAR_LIVE_MAX_AGE_MINUTES,
              historyWindowMinutes: RADAR_LIVE_HISTORY_MINUTES
            };
            return accepted;
          }

          '''
          text = text[:start] + new_live + text[end:]
          text = text.replace('// Radar KML, image proxy and deterministic test frames', '// Current HKO radar JSON feed, image proxy and deterministic test frames', 1)

          path.write_text(text)
          PY
      - name: Validate Worker v2.4.2
        run: |
          node --check worker.js
          grep -q "const VERSION = '2.4.2';" worker.js
          grep -q "temp_json/nradar_img.json" worker.js
          grep -q "feedKey: 'range2'" worker.js
          grep -q "feedKey: 'range0'" worker.js
          grep -q "stale-live-feed-latest-frame" worker.js
          grep -q "historyWindowMinutes" worker.js
      - name: Live feed parser smoke test
        run: |
          curl -fsSL --compressed -A 'Mozilla/5.0' "https://www.hko.gov.hk/wxinfo/radars/temp_json/nradar_img.json?$(date +%s)" -o /tmp/radar.json
          node - <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/radar.json', 'utf8'));
          const re = /["']([^"']+\.(?:png|gif|jpe?g|webp))["']/i;
          for (const [key, prefix] of [['range0','rad_256_png/'], ['range2','rad_064_png/']]) {
            const items = data?.radar?.[key]?.image;
            if (!Array.isArray(items) || items.length < 2) throw new Error(`${key}: missing images`);
            const paths = items.map(v => String(v).match(re)?.[1]).filter(Boolean);
            if (paths.length !== items.length) throw new Error(`${key}: parse mismatch`);
            if (!paths.every(p => p.startsWith(prefix))) throw new Error(`${key}: unexpected path`);
            const latest = paths.at(-1);
            const m = latest.match(/(20\d{2})([01]\d)([0-3]\d)([0-2]\d)([0-5]\d)/);
            if (!m) throw new Error(`${key}: no timestamp`);
            const [,y,mo,d,h,mi] = m;
            const latestMs = Date.parse(`${y}-${mo}-${d}T${h}:${mi}:00+08:00`);
            const ageMin = (Date.now() - latestMs) / 60000;
            console.log(key, 'frames=', paths.length, 'latest=', latest, 'ageMin=', ageMin.toFixed(1));
            if (ageMin < -10 || ageMin > 30) throw new Error(`${key}: live feed stale`);
          }
          NODE
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add worker.js
          git commit -m "fix: apply Worker v2.4.2 live source"
          git push origin HEAD:feature/worker-v2.4.2-live-source
