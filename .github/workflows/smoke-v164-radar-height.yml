name: Smoke v1.6.4 radar height API

on:
  push:
    branches:
      - feature/v1.6.4-radar-height
    paths:
      - 'worker.js'
      - '.github/workflows/smoke-v164-radar-height.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.6.4-radar-height
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exercise Worker radar endpoints against current HKO KML
        run: |
          node --input-type=module <<'JS'
          globalThis.caches = { default: { match: async () => null, put: async () => undefined } };
          const worker = (await import('./worker.js')).default;

          async function get(path) {
            const response = await worker.fetch(new Request(`https://local.test${path}`));
            const text = await response.text();
            let body;
            try { body = JSON.parse(text); } catch { throw new Error(`${path} returned non-JSON ${response.status}: ${text.slice(0,200)}`); }
            if (!response.ok || !body.ok) throw new Error(`${path} failed ${response.status}: ${JSON.stringify(body).slice(0,1000)}`);
            return body;
          }

          const two = await get('/api/radar/frames?range=64&height=2&mode=live');
          if (two.version !== '2.4.4' || two.rangeKm !== 64 || two.heightKm !== 2) throw new Error('64/2 metadata mismatch');
          if (!two.root.includes('Radar_064k.kml') || two.frames.length < 10) throw new Error('64/2 source or frame count mismatch');
          if (!two.frames.every(f => f.bounds && f.imageUrl && f.time)) throw new Error('64/2 incomplete frame');

          const three = await get('/api/radar/frames?range=64&height=3&mode=live');
          if (three.heightKm !== 3 || !three.root.includes('R4_GIS_rad_064')) throw new Error('64/3 source mismatch');

          const wide = await get('/api/radar/frames?range=256&height=2&mode=live');
          if (wide.rangeKm !== 256 || wide.heightKm !== 3) throw new Error('256 km must normalize to 3 km height');

          const capabilities = await get('/api/capabilities');
          const heights = capabilities.radarContract?.heightsKmByRange;
          if (!Array.isArray(heights?.['64']) || !heights['64'].includes(2) || heights?.['256']?.length !== 1 || heights['256'][0] !== 3) throw new Error('height capabilities mismatch');

          console.log(JSON.stringify({
            version: two.version,
            twoKm: { frames: two.frameCount, latest: two.issueTime, root: two.root, bounds: two.frames.at(-1).bounds },
            threeKm: { frames: three.frameCount, latest: three.issueTime },
            wide: { frames: wide.frameCount, normalizedHeight: wide.heightKm },
            heights
          }, null, 2));
          JS
