name: Patch v2.4.3 GIS radar source

on:
  push:
    branches:
      - feature/v1.6.2-radar-rendering-fix

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'use current HKO GIS radar overlays') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.6.2-radar-rendering-fix
      - name: Patch Worker and radar renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing block: {label}')
              return text.replace(old, new, 1)

          # Worker v2.4.3: use the same georeferenced transparent R4 GIS
          # overlays used by HKO Regional Weather Information Portal.
          path = Path('worker.js')
          w = path.read_text()
          w = w.replace('Hong Kong Point Rainfall Forecast Worker v2.4.2', 'Hong Kong Point Rainfall Forecast Worker v2.4.3', 1)
          w = w.replace("const VERSION = '2.4.2';", "const VERSION = '2.4.3';", 1)
          w = w.replace("const HKO_RADAR_INDEX = 'https://www.hko.gov.hk/wxinfo/radars/temp_json/nradar_img.json';\nconst HKO_RADAR_IMAGE_ROOT = 'https://www.hko.gov.hk/wxinfo/radars/';\n", "")

          start = w.index('const RADAR = Object.freeze({')
          end = w.index('\n\nconst RADAR_CONTRACT', start)
          w = w[:start] + '''const RADAR = Object.freeze({
  64: {
    kmlRoot: 'https://www.hko.gov.hk/wxinfo/radars/R4_GIS_rad_064/R4_GIS_server_Radar_064.kml',
    product: '64 km range, 3 km height, GIS overlay',
    fallbackBounds: { north: 22.87770, south: 21.72659, east: 114.79378, west: 113.54956 }
  },
  256: {
    kmlRoot: 'https://www.hko.gov.hk/wxinfo/radars/R4_GIS_rad_256/R4_GIS_server_Radar_256.kml',
    product: '256 km range, 3 km height, GIS overlay',
    fallbackBounds: { north: 24.58614, south: 19.98259, east: 116.66013, west: 111.68321 }
  }
});''' + w[end:]

          radar_start = w.index('async function handleRadarFrames(range, mode, probe) {')
          validate_start = w.index('function validateCurrentRadarFrames(frames, diagnostics) {', radar_start)
          new_radar = '''async function handleRadarFrames(range, mode, probe) {
  if (mode === 'test') return handleTestRadarFrames(range, probe);

  const source = RADAR[range];
  const diagnostics = {
    attempts: [], documents: [], errors: [], rejected: [],
    policy: `Current HKO R4 GIS KML; latest frame <= ${RADAR_LIVE_MAX_AGE_MINUTES} min old; history <= ${RADAR_LIVE_HISTORY_MINUTES} min`,
    mode: 'live',
    product: source.product,
    transparentOverlay: true
  };
  let frames = [];
  try {
    frames = await collectKmlFrames(source.kmlRoot, range, diagnostics);
  } catch (error) {
    diagnostics.errors.push(safeError(error));
  }

  frames = validateCurrentRadarFrames(dedupeFrames(frames), diagnostics).slice(-RADAR_MAX_FRAMES);
  const issueTime = frames.at(-1)?.time || null;
  const payload = {
    ok: frames.length > 0,
    version: VERSION,
    contractVersion: RADAR_CONTRACT.version,
    rangeKm: range,
    mode: 'live',
    source: 'Hong Kong Observatory current GIS radar KML',
    root: source.kmlRoot,
    product: source.product,
    renderMode: 'transparent-georeferenced-overlay',
    generatedAt: new Date().toISOString(),
    issueTime,
    cadenceMinutes: RADAR_CADENCE_MINUTES,
    frameCount: frames.length,
    error: frames.length ? null : 'HKO live GIS radar source is stale or unavailable',
    frames: frames.map((frame, index) => ({
      id: encodeUrl(frame.href),
      index,
      time: frame.time,
      name: frame.name || `Radar ${index + 1}`,
      bounds: frame.bounds || source.fallbackBounds,
      source: 'hko-current-gis-kml',
      timeSource: frame.timeSource || null,
      rawTime: probe ? (frame.rawTime || null) : undefined,
      imageUrl: `/api/radar/image?id=${encodeURIComponent(encodeUrl(frame.href))}`
    }))
  };

  if (probe) {
    payload.diagnostics = diagnostics;
    return json(payload, 200, { 'Cache-Control': 'no-store' });
  }

  return json(payload, frames.length ? 200 : 502, { 'Cache-Control': `public, max-age=${RADAR_CACHE_TTL_SECONDS}` });
}

'''
          w = w[:radar_start] + new_radar + w[validate_start:]

          old_time = """      const kmlTime = parseKmlTime(block);\n      const textTime = parseTimeFromText(`${name} ${href}`);\n      const time = kmlTime || textTime;\n      frames.push({ href, bounds, name, time, rawTime: time, timeSource: kmlTime ? 'kml' : (textTime ? 'text' : null), source: 'kml' });"""
          new_time = """      const kmlTime = parseKmlTime(block);\n      const textTime = parseTimeFromText(`${name} ${href}`);\n      // R4 GIS KML labels its timestamps as HKT while the <when> value ends in Z.\n      // The filename/name carries the unambiguous Hong Kong local radar time.\n      const time = textTime || kmlTime;\n      frames.push({ href, bounds, name, time, rawTime: time, timeSource: textTime ? 'filename-hkt' : (kmlTime ? 'kml' : null), source: 'kml' });"""
          w = replace_once(w, old_time, new_time, 'prefer R4 filename HKT')
          path.write_text(w)

          # Frontend: transparent GIS PNG can be used as a normal overlay over CARTO.
          path = Path('js/radar.js')
          r = path.read_text()
          r = r.replace("const LIVE_CROP_CACHE_LIMIT = 18;\nconst LIVE_CROP_ASPECT_THRESHOLD = 1.08;\n", "")
          r = r.replace("const liveCropCache = new Map();\n", "")
          r = r.replace("      ? `Worker 已提供雷達幀；契約版本 ${state.worker.radarContract?.version || '不詳'}。Live 模式會使用 HKO 雷達地圖本體並暫時隱藏 CARTO 底圖，避免兩套地圖重疊。`", "      ? `Worker 已提供雷達幀；契約版本 ${state.worker.radarContract?.version || '不詳'}。Live 模式使用 HKO GIS 透明雷達回波，保留現有地圖及定點標記。`")
          r = r.replace("      syncRadarSurfaceMode(false);\n", "")

          show_start = r.index('async function showRadarFrame() {')
          config_start = r.index('function configureTimeline(data) {', show_start)
          new_show = '''async function showRadarFrame() {
  const frame = state.radar.frames[state.radar.index];
  if (!frame || !window.L || !state.map) return;
  const token = ++displayToken;
  const url = resolveImageUrl(frame.imageUrl);
  setTimelineLoading(true);
  const loaded = await preloadImage(url);
  if (token !== displayToken) return;
  if (!loaded) throw new Error('雷達影像載入失敗');

  ensureRadarPane();
  const bounds = [[frame.bounds.south,frame.bounds.west],[frame.bounds.north,frame.bounds.east]];
  const next = window.L.imageOverlay(url, bounds, {
    opacity:state.radar.opacity,
    interactive:false,
    pane:'radarPane',
    className:`rain-radar-overlay ${radarMode === 'live' ? 'live-radar-overlay' : 'test-radar-overlay'}`
  }).addTo(state.map);

  if (state.radar.layer) state.map.removeLayer(state.radar.layer);
  state.radar.layer = next;
  updateTimelineLabels(frame);
  setTimelineLoading(false);
  preloadAdjacentFrames();
}

function ensureRadarPane() {
  if (!state.map) return;
  let pane = state.map.getPane('radarPane');
  if (!pane) pane = state.map.createPane('radarPane');
  pane.style.zIndex = '350';
  pane.style.pointerEvents = 'none';
}

'''
          r = r[:show_start] + new_show + r[config_start:]

          r = r.replace("  syncRadarSurfaceMode(false);\n  clearLiveCropCache();\n", "")
          r = r.replace("  else {\n    syncRadarSurfaceMode(false);\n    configureTimeline(null);\n  }", "  else configureTimeline(null);")
          r = r.replace("if (source) source.textContent = radarMode === 'test' ? '模擬測試幀' : 'HKO 雷達地圖';", "if (source) source.textContent = radarMode === 'test' ? '模擬測試幀' : 'HKO 即時雷達';")
          r = r.replace("left.innerHTML = '<span id=\"radar-source-label\">HKO 雷達地圖</span><span id=\"radar-mode-chip\" class=\"radar-mode-chip\">64 km</span>';", "left.innerHTML = '<span id=\"radar-source-label\">HKO 即時雷達</span><span id=\"radar-mode-chip\" class=\"radar-mode-chip\">64 km</span>';")
          r = r.replace(".rain-radar-overlay{image-rendering:auto}.live-radar-surface{background:#000!important}.live-radar-map{mix-blend-mode:normal}", ".rain-radar-overlay{image-rendering:auto}")
          path.write_text(r)
          PY
      - name: Syntax check
        run: |
          node --check worker.js
          node --check js/radar.js
      - name: Commit GIS overlay integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js js/radar.js
          git commit -m "v1.6.2: use current HKO GIS radar overlays"
          git push origin HEAD:feature/v1.6.2-radar-rendering-fix
