name: Patch v2.4.3 GIS radar source

on:
  push:
    branches:
      - feature/v1.6.2-radar-rendering-fix

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'use current HKO GIS radar overlays') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.6.2-radar-rendering-fix
      - name: Patch Worker and radar renderer
        run: python3 .github/scripts/patch_v243.py
      - name: Syntax check
        run: |
          node --check worker.js
          node --check js/radar.js
      - name: Commit GIS overlay integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker.js js/radar.js
          git commit -m "v1.6.2: use current HKO GIS radar overlays"
          git push origin HEAD:feature/v1.6.2-radar-rendering-fix
