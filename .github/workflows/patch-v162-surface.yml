name: Apply v1.6.2 radar surface patch
on:
  push:
    branches: [feature/v1.6.2-radar-surface]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'v1.6.2 radar surface implementation') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.6.2-radar-surface
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch files
        run: |
          python3 <<'PY'
          from pathlib import Path
          def r(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing target: {path}: {old[:80]!r}')
              p.write_text(s.replace(old,new,1))

          r('js/config.js', "export const APP_VERSION = '1.6.1';", "export const APP_VERSION = '1.6.2';")
          r('service-worker.js', "const CACHE_VERSION = 'point-rain-pwa-v1.6.1';", "const CACHE_VERSION = 'point-rain-pwa-v1.6.2';")
          r('js/state.js', "radar: { frames:[], index:0, range:loadRadarRange(), opacity:loadRadarOpacity(), layer:null },", "radar: { frames:[], index:0, range:loadRadarRange(), opacity:loadRadarOpacity(), layer:null, surfaceActive:false, renderedUrl:null },")

          r('js/map.js', "export function centerHongKong() { state.map?.setView([22.35,114.15], 11); }\n\nexport function toggleBasemap() {\n  if (!state.map) return;\n  const useLight = state.activeTiles !== 'light';\n  const next = useLight ? state.mapLayers.lightTiles : state.mapLayers.darkTiles;\n  const previous = useLight ? state.mapLayers.darkTiles : state.mapLayers.lightTiles;\n  if (state.map.hasLayer(previous)) state.map.removeLayer(previous);\n  next.addTo(state.map); next.bringToBack();\n  state.activeTiles = useLight ? 'light' : 'dark';\n  localStorage.setItem('hkRainBasemap', state.activeTiles);\n}\n", "export function centerHongKong() { state.map?.setView([22.35,114.15], 11); }\n\nexport function setRadarSurfaceActive(active) {\n  if (!state.map) return;\n  state.radar.surfaceActive = Boolean(active);\n  const activeTiles = state.activeTiles === 'light' ? state.mapLayers.lightTiles : state.mapLayers.darkTiles;\n  const inactiveTiles = state.activeTiles === 'light' ? state.mapLayers.darkTiles : state.mapLayers.lightTiles;\n  if (state.radar.surfaceActive) {\n    if (state.map.hasLayer(activeTiles)) state.map.removeLayer(activeTiles);\n    if (state.map.hasLayer(inactiveTiles)) state.map.removeLayer(inactiveTiles);\n    state.map.getContainer()?.classList.add('radar-surface-active');\n    return;\n  }\n  if (state.map.hasLayer(inactiveTiles)) state.map.removeLayer(inactiveTiles);\n  if (!state.map.hasLayer(activeTiles)) activeTiles.addTo(state.map);\n  activeTiles.bringToBack();\n  state.map.getContainer()?.classList.remove('radar-surface-active');\n}\n\nexport function toggleBasemap() {\n  if (!state.map) return;\n  const useLight = state.activeTiles !== 'light';\n  const next = useLight ? state.mapLayers.lightTiles : state.mapLayers.darkTiles;\n  const previous = useLight ? state.mapLayers.darkTiles : state.mapLayers.lightTiles;\n  if (state.map.hasLayer(previous)) state.map.removeLayer(previous);\n  if (state.radar.surfaceActive) {\n    if (state.map.hasLayer(next)) state.map.removeLayer(next);\n  } else {\n    if (!state.map.hasLayer(next)) next.addTo(state.map);\n    next.bringToBack();\n  }\n  state.activeTiles = useLight ? 'light' : 'dark';\n  localStorage.setItem('hkRainBasemap', state.activeTiles);\n}\n")

          r('js/radar.js', "import { state } from './state.js';\nimport { clamp, formatDateTime, isMobileLayout } from './utils.js';", "import { state } from './state.js';\nimport { setRadarSurfaceActive } from './map.js';\nimport { clamp, formatDateTime, isMobileLayout } from './utils.js';")
          r('js/radar.js', 'const RECENT_PRELOAD_COUNT = 12;', 'const RECENT_PRELOAD_COUNT = 12;\nconst LIVE_CROP_CACHE_LIMIT = 36;')
          r('js/radar.js', "let controlsReady = false;\nlet radarMode = localStorage.getItem('hkRainRadarMode') === 'test' ? 'test' : 'live';", "let controlsReady = false;\nconst liveCropCache = new Map();\nlet radarMode = localStorage.getItem('hkRainRadarMode') === 'test' ? 'test' : 'live';")

          old='''async function showRadarFrame() {\n  const frame = state.radar.frames[state.radar.index];\n  if (!frame || !window.L || !state.map) return;\n  const token = ++displayToken;\n  const url = resolveImageUrl(frame.imageUrl);\n  setTimelineLoading(true);\n  const loaded = await preloadImage(url);\n  if (token !== displayToken) return;\n  if (!loaded) throw new Error('雷達影像載入失敗');\n\n  const bounds = [[frame.bounds.south,frame.bounds.west],[frame.bounds.north,frame.bounds.east]];\n  const next = window.L.imageOverlay(url, bounds, {\n    opacity:state.radar.opacity,\n    interactive:false,\n    className:'rain-radar-overlay'\n  }).addTo(state.map);\n\n  if (state.radar.layer) state.map.removeLayer(state.radar.layer);\n  state.radar.layer = next;\n  updateTimelineLabels(frame);\n  setTimelineLoading(false);\n  preloadAdjacentFrames();\n}\n'''
          new='''async function showRadarFrame() {\n  const frame = state.radar.frames[state.radar.index];\n  if (!frame || !window.L || !state.map) return;\n  const token = ++displayToken;\n  const rawUrl = resolveImageUrl(frame.imageUrl);\n  setTimelineLoading(true);\n  const prepared = radarMode === 'live'\n    ? await prepareLiveRadarSurface(rawUrl)\n    : { url:rawUrl, loaded:await preloadImage(rawUrl), cropped:false };\n  if (token !== displayToken) return;\n  if (!prepared.loaded) throw new Error('雷達影像載入失敗');\n  setRadarSurfaceActive(radarMode === 'live');\n  const bounds = [[frame.bounds.south,frame.bounds.west],[frame.bounds.north,frame.bounds.east]];\n  const next = window.L.imageOverlay(prepared.url, bounds, {\n    opacity:state.radar.opacity,\n    interactive:false,\n    className:radarMode === 'live' ? 'rain-radar-overlay radar-live-surface' : 'rain-radar-overlay radar-test-overlay'\n  }).addTo(state.map);\n  if (state.radar.layer) state.map.removeLayer(state.radar.layer);\n  state.radar.layer = next;\n  state.radar.renderedUrl = prepared.url;\n  updateTimelineLabels(frame);\n  setTimelineLoading(false);\n  preloadAdjacentFrames();\n}\n'''
          r('js/radar.js',old,new)
          r('js/radar.js', "      removeRadarLayer();\n      state.radar.frames = [];", "      removeRadarLayer();\n      setRadarSurfaceActive(false);\n      clearLiveCropCache();\n      state.radar.frames = [];")
          r('js/radar.js', "  removeRadarLayer();\n  document.getElementById('radar-timeline')?.classList.add('hidden');", "  removeRadarLayer();\n  setRadarSurfaceActive(false);\n  clearLiveCropCache();\n  document.getElementById('radar-timeline')?.classList.add('hidden');")

          old='''function preloadRecentFrames(frames) {\n  const token = ++preloadToken;\n  const recent = frames.slice(-RECENT_PRELOAD_COUNT);\n  Promise.allSettled(recent.map(async frame => {\n    if (token !== preloadToken) return;\n    await preloadImage(resolveImageUrl(frame.imageUrl));\n  })).catch(() => {});\n}\n\nfunction preloadAdjacentFrames() {\n  const indexes = [state.radar.index - 2, state.radar.index - 1, state.radar.index + 1, state.radar.index + 2]\n    .filter(index => index >= 0 && index < state.radar.frames.length);\n  indexes.forEach(index => preloadImage(resolveImageUrl(state.radar.frames[index].imageUrl)).catch(() => false));\n}\n\nfunction resolveImageUrl(imageUrl) {\n  return /^https?:/i.test(imageUrl)\n    ? imageUrl\n    : state.apiBase + (imageUrl.startsWith('/') ? '' : '/') + imageUrl;\n}\n\nfunction preloadImage(url) {\n  return new Promise(resolve => {\n    const image = new Image();\n    image.onload = () => resolve(true);\n    image.onerror = () => resolve(false);\n    image.src = url;\n  });\n}\n'''
          new='''function preloadRecentFrames(frames) {\n  const token = ++preloadToken;\n  const recent = frames.slice(-RECENT_PRELOAD_COUNT);\n  Promise.allSettled(recent.map(async frame => {\n    if (token !== preloadToken) return;\n    await preloadImage(resolveImageUrl(frame.imageUrl));\n  })).catch(() => {});\n}\n\nfunction preloadAdjacentFrames() {\n  const indexes = [state.radar.index - 2, state.radar.index - 1, state.radar.index + 1, state.radar.index + 2]\n    .filter(index => index >= 0 && index < state.radar.frames.length);\n  indexes.forEach(index => {\n    const url = resolveImageUrl(state.radar.frames[index].imageUrl);\n    const task = radarMode === 'live' ? prepareLiveRadarSurface(url) : preloadImage(url);\n    Promise.resolve(task).catch(() => false);\n  });\n}\n\nfunction resolveImageUrl(imageUrl) {\n  return /^https?:/i.test(imageUrl)\n    ? imageUrl\n    : state.apiBase + (imageUrl.startsWith('/') ? '' : '/') + imageUrl;\n}\n\nasync function prepareLiveRadarSurface(url) {\n  const cached = liveCropCache.get(url);\n  if (cached) {\n    liveCropCache.delete(url);\n    liveCropCache.set(url, cached);\n    return { url:cached, loaded:true, cropped:true };\n  }\n  const image = await loadImageElement(url);\n  const width = image.naturalWidth;\n  const height = image.naturalHeight;\n  if (!width || !height) throw new Error('雷達影像尺寸無效');\n  const needsCrop = width > Math.round(height * 1.08);\n  if (!needsCrop) return { url, loaded:true, cropped:false };\n  const cropWidth = Math.min(width, height);\n  const canvas = document.createElement('canvas');\n  canvas.width = cropWidth;\n  canvas.height = height;\n  const context = canvas.getContext('2d', { alpha:false });\n  if (!context) throw new Error('瀏覽器無法建立雷達裁圖畫布');\n  context.drawImage(image, 0, 0, cropWidth, height, 0, 0, cropWidth, height);\n  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));\n  if (!blob) throw new Error('雷達地圖裁圖失敗');\n  const objectUrl = URL.createObjectURL(blob);\n  liveCropCache.set(url, objectUrl);\n  trimLiveCropCache();\n  return { url:objectUrl, loaded:true, cropped:true };\n}\n\nfunction loadImageElement(url) {\n  return new Promise((resolve, reject) => {\n    const image = new Image();\n    image.crossOrigin = 'anonymous';\n    image.onload = () => resolve(image);\n    image.onerror = () => reject(new Error('雷達影像載入失敗'));\n    image.src = url;\n  });\n}\n\nasync function preloadImage(url) {\n  try { await loadImageElement(url); return true; } catch { return false; }\n}\n\nfunction trimLiveCropCache() {\n  while (liveCropCache.size > LIVE_CROP_CACHE_LIMIT) {\n    const oldestKey = liveCropCache.keys().next().value;\n    const objectUrl = liveCropCache.get(oldestKey);\n    if (objectUrl === state.radar.renderedUrl) break;\n    liveCropCache.delete(oldestKey);\n    if (objectUrl?.startsWith('blob:')) URL.revokeObjectURL(objectUrl);\n  }\n}\n\nfunction clearLiveCropCache() {\n  for (const objectUrl of liveCropCache.values()) {\n    if (objectUrl?.startsWith('blob:')) URL.revokeObjectURL(objectUrl);\n  }\n  liveCropCache.clear();\n  state.radar.renderedUrl = null;\n}\n'''
          r('js/radar.js',old,new)

          r('README.md','# 香港定點雨量預報 v1.6.1','# 香港定點雨量預報 v1.6.2')
          r('README.md','前端 v1.6.0 的定點預報仍兼容 Worker v2.3 或以上；','前端 v1.6.2 的定點預報仍兼容 Worker v2.3 或以上；')
          p=Path('README.md'); s=p.read_text(); marker='## Worker v2.4.2 Current HKO Live Radar Source\n'; section='''## v1.6.2 Radar Rendering Fix\n\n- HKO Live 雷達成品 JPEG 先在瀏覽器裁走右側資訊欄，只使用左側正方形雷達地圖。\n- Live 雷達期間暫停 CARTO 底圖，避免兩套道路／海岸線重疊；關閉雷達或切到 TEST 模式即恢復。\n- 定點標記、附近半徑、Bottom Sheet 與時間軸維持在雷達 surface 上方。\n- Canvas 裁圖以 Blob URL 快取並在關閉時釋放；Worker 維持 v2.4.2。\n- Service Worker 快取更新至 `point-rain-pwa-v1.6.2`。\n\n'''; p.write_text(s.replace(marker,section+marker,1))
          p=Path('CHANGELOG.md'); s=p.read_text(); marker='## Worker v2.4.2 Current HKO Live Source\n'; section='''## v1.6.2 Radar Rendering Fix\n\n- 修正 HKO 577×400 成品 JPEG 全幅壓入 bounds 造成雷達地圖橫向變形。\n- Live 幀裁成左側 400×400 地圖區域，再交給 Leaflet `imageOverlay`。\n- Live 模式暫停 CARTO 底圖，避免 HKO 內建地圖與 CARTO 形成雙影；TEST 模式仍為透明 Overlay。\n- 關閉、Live 載入失敗或切 TEST 時恢復底圖；裁圖 Blob 設快取及釋放。\n- App 升級至 v1.6.2；Worker 維持 v2.4.2。\n\n'''; p.write_text(s.replace(marker,section+marker,1))
          p=Path('index.html'); s=p.read_text(); p.write_text(s.replace('v1.6.1','v1.6.2')) if 'v1.6.1' in s else None
          PY
      - name: Validate
        run: |
          node --check js/config.js
          node --check js/state.js
          node --check js/map.js
          node --check js/radar.js
          node --check service-worker.js
          grep -q "APP_VERSION = '1.6.2'" js/config.js
          grep -q 'radar-live-surface' js/radar.js
          git diff --check
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/config.js js/state.js js/map.js js/radar.js service-worker.js README.md CHANGELOG.md index.html
          git commit -m 'fix: v1.6.2 radar surface implementation'
          git push origin HEAD:feature/v1.6.2-radar-surface
