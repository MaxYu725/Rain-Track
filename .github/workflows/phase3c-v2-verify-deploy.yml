name: Phase 3C v2 verify deploy

on:
  push:
    branches:
      - phase3c-v2/single-frame-point-endpoint

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy-worker-production
  cancel-in-progress: false

env:
  CANARY_BASE_URL: https://radar-phase3c-v2.max-yu.workers.dev
  PROD_BASE_URL: https://radar.max-yu.workers.dev

jobs:
  verify-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Phase 3C v2 bundle before deployment
        run: |
          node --check worker.js
          node --check worker-phase3c-v2.js
          node --check swirls-point-sample.js
          node --check swirls-point-request.js
          node scripts/validate-swirls-point-sample.mjs
          node scripts/validate-swirls-point-request.mjs
          node scripts/validate-phase3c-v2-worker.mjs
          node scripts/validate-worker-swirls-inline.mjs

      - name: Deploy isolated canary Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: |
            deploy worker-phase3c-v2.js --name radar-phase3c-v2 --compatibility-date 2026-08-05 --keep-vars --dry-run
            deploy worker-phase3c-v2.js --name radar-phase3c-v2 --compatibility-date 2026-08-05 --keep-vars
            deployments status --name radar-phase3c-v2 --json

      - name: Smoke all Stable Recovery routes on canary
        env:
          WORKER_BASE_URL: ${{ env.CANARY_BASE_URL }}
        run: node scripts/smoke-worker-production.mjs

      - name: Verify compact point endpoint on canary
        env:
          WORKER_BASE_URL: ${{ env.CANARY_BASE_URL }}
        run: node scripts/probe-swirls-point-production.mjs

      - name: Promote verified bundle to production
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.123.0'
          command: |
            deploy worker-phase3c-v2.js --name radar --compatibility-date 2026-08-05 --keep-vars --dry-run
            deploy worker-phase3c-v2.js --name radar --compatibility-date 2026-08-05 --keep-vars
            deployments status --name radar --json

      - name: Smoke Stable Recovery routes after production promotion
        env:
          WORKER_BASE_URL: ${{ env.PROD_BASE_URL }}
        run: node scripts/smoke-worker-production.mjs

      - name: Verify compact point endpoint in production
        env:
          WORKER_BASE_URL: ${{ env.PROD_BASE_URL }}
        run: node scripts/probe-swirls-point-production.mjs

      - name: Verify Recovery bindings remain absent
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          account = os.environ['CLOUDFLARE_ACCOUNT_ID']
          token = os.environ['CLOUDFLARE_API_TOKEN']
          base = f'https://api.cloudflare.com/client/v4/accounts/{account}/workers/scripts/radar'

          def get(path):
              request = urllib.request.Request(
                  base + path,
                  headers={'Authorization': f'Bearer {token}', 'User-Agent': 'Rain-Track-phase3c-v2-verify/1.0'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              assert payload.get('success') is True, payload.get('errors')
              return payload.get('result')

          schedules = get('/schedules') or []
          if isinstance(schedules, dict):
              schedules = schedules.get('schedules', [])
          assert schedules == [], f'Expected no Worker Cron triggers, got {schedules!r}'

          settings = get('/settings') or {}
          bindings = settings.get('bindings', []) if isinstance(settings, dict) else []
          names = sorted(binding.get('name') for binding in bindings if isinstance(binding, dict) and binding.get('name'))
          assert 'SWIRLS_SNAPSHOTS' not in names, f'Experimental KV binding returned: {names!r}'
          print('PASS production Cron triggers: 0')
          print('PASS SWIRLS_SNAPSHOTS binding absent')
          PY

      - name: Remove temporary canary Worker
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          url = f"https://api.cloudflare.com/client/v4/accounts/{os.environ['CLOUDFLARE_ACCOUNT_ID']}/workers/scripts/radar-phase3c-v2"
          request = urllib.request.Request(
              url,
              method='DELETE',
              headers={'Authorization': f"Bearer {os.environ['CLOUDFLARE_API_TOKEN']}", 'User-Agent': 'Rain-Track-phase3c-v2-cleanup/1.0'},
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              if payload.get('success') is not True:
                  print('Canary cleanup warning:', payload.get('errors'))
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  print('Canary cleanup warning: HTTP', error.code)
          PY

      - name: Record successful production verification on PR 57
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              '✅ Phase 3C v2 production verification PASS\n\n'
              f"- commit: `{os.environ['GH_SHA']}`\n"
              f"- Actions run: `{os.environ['GH_RUN_ID']}`\n"
              '- canary: legacy Stable Recovery smoke PASS\n'
              '- canary: compact single-frame point smoke PASS\n'
              '- production: legacy Stable Recovery smoke PASS\n'
              '- production: compact point matches full-frame local interpolation PASS\n'
              '- production Cron triggers: 0\n'
              '- `SWIRLS_SNAPSHOTS` binding: absent\n'
              '- temporary canary cleanup attempted\n'
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/issues/57/comments",
              method='POST',
              data=json.dumps({'body': body}).encode(),
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'Rain-Track-phase3c-v2-verify/1.0',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status in (200, 201)
          PY

      - name: Record failed production verification on PR 57
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          body = (
              '❌ Phase 3C v2 production verification FAILED\n\n'
              f"- commit: `{os.environ['GH_SHA']}`\n"
              f"- Actions run: `{os.environ['GH_RUN_ID']}`\n"
              '- Do not merge or begin Android integration until the failed step is resolved.\n'
          )
          request = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/issues/57/comments",
              method='POST',
              data=json.dumps({'body': body}).encode(),
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'User-Agent': 'Rain-Track-phase3c-v2-verify/1.0',
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              assert response.status in (200, 201)
          PY
