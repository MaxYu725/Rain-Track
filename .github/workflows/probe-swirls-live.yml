name: Probe SWIRLS live upstream

on:
  push:
    branches:
      - feature/phase3b-swirls-live-runtime

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe live HKO SWIRLS feed
        run: node scripts/probe-swirls-live.mjs
