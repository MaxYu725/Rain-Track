name: Probe HKO 2 km radar GIS source

on:
  push:
    branches:
      - feature/v1.6.4-radar-height
    paths:
      - '.github/workflows/probe-hko-2km.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official 2 km radar page
        shell: bash
        run: |
          set -uo pipefail
          PAGE='https://www.hko.gov.hk/en/wxinfo/radars/radar_range1_2km.htm'
          curl -A 'Mozilla/5.0' -fsSL "$PAGE" -o /tmp/page.html
          echo '--- KML / 2km references in page ---'
          grep -Eio '.{0,180}(kml|2km|R4_GIS).{0,240}' /tmp/page.html | head -100 || true

      - name: Inspect official KML target from page
        shell: bash
        run: |
          set -uo pipefail
          KML='https://www.hko.gov.hk/wxinfo/radars/radar_064_kml/Radar_064k.kml'
          code=$(curl -A 'Mozilla/5.0' -L -sS -D /tmp/headers -o /tmp/radar2.kml -w '%{http_code}' "$KML" || true)
          echo "HTTP $code bytes $(wc -c < /tmp/radar2.kml)"
          cat /tmp/headers | grep -Ei 'content-type|last-modified|date:' || true
          echo '--- KML body ---'
          head -c 12000 /tmp/radar2.kml
          echo
          echo '--- href/time/bounds summary ---'
          grep -Eio '<(href|when|north|south|east|west)>[^<]+' /tmp/radar2.kml | head -120 || true

      - name: Compare current 3 km GIS KML
        shell: bash
        run: |
          set -uo pipefail
          KML='https://www.hko.gov.hk/wxinfo/radars/R4_GIS_rad_064/R4_GIS_server_Radar_064.kml'
          curl -A 'Mozilla/5.0' -fsSL "$KML" -o /tmp/radar3.kml
          echo "3km bytes $(wc -c < /tmp/radar3.kml)"
          grep -Eio '<(href|when|north|south|east|west)>[^<]+' /tmp/radar3.kml | head -40 || true
