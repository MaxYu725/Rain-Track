name: Probe HKO 2 km radar GIS source

on:
  push:
    branches:
      - feature/v1.6.4-radar-height
    paths:
      - '.github/workflows/probe-hko-2km.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify official 2 km GIS KML and latest PNG
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://www.hko.gov.hk/en/wxinfo/radars/radar_range1_2km.htm'
          ROOT='https://www.hko.gov.hk/wxinfo/radars/radar_064_kml/Radar_064k.kml'
          SERVER='https://www.hko.gov.hk/wxinfo/radars/radar_064_kml/server_Radar_064k.kml'
          curl -A 'Mozilla/5.0' -fsSL "$PAGE" -o /tmp/page.html
          curl -A 'Mozilla/5.0' -fsSL "$ROOT" -o /tmp/root.kml
          curl -A 'Mozilla/5.0' -fsSL "$SERVER" -o /tmp/server.kml
          echo '--- page link ---'
          grep -Eio '.{0,120}radar_064_kml/Radar_064k\.kml.{0,120}' /tmp/page.html | head -5 || true
          echo '--- latest server frame ---'
          href=$(grep -Eio '<href>[^<]*_rad_064k\.png' /tmp/server.kml | sed 's#<href>##I' | head -1)
          echo "$href"
          image="https://www.hko.gov.hk/wxinfo/radars/radar_064_kml/$href"
          curl -A 'Mozilla/5.0' -fsSL "$image" -o /tmp/radar2.png
          file /tmp/radar2.png
          python - <<'PY'
          import struct
          p='/tmp/radar2.png'
          b=open(p,'rb').read()
          assert b[:8]==b'\x89PNG\r\n\x1a\n'
          length=struct.unpack('>I',b[8:12])[0]
          assert b[12:16]==b'IHDR'
          w,h,depth,color,comp,filt,interlace=struct.unpack('>IIBBBBB',b[16:29])
          chunks=[]; i=8
          while i+12 <= len(b):
              n=struct.unpack('>I',b[i:i+4])[0]
              typ=b[i+4:i+8].decode('latin1')
              chunks.append(typ)
              i += 12+n
              if typ=='IEND': break
          print({'width':w,'height':h,'bitDepth':depth,'colorType':color,'hasTRNS':'tRNS' in chunks,'chunks':chunks[:20]})
          PY
          echo '--- latest frame time and bounds ---'
          grep -Eio '<(name|href|north|south|east|west)>[^<]+' /tmp/server.kml | head -24 || true

      - name: Compare 3 km GIS PNG
        shell: bash
        run: |
          set -euo pipefail
          KML='https://www.hko.gov.hk/wxinfo/radars/R4_GIS_rad_064/R4_GIS_server_Radar_064.kml'
          curl -A 'Mozilla/5.0' -fsSL "$KML" -o /tmp/radar3.kml
          href=$(grep -Eio '<href>[^<]*_rad_064\.png' /tmp/radar3.kml | sed 's#<href>##I' | head -1)
          image="https://www.hko.gov.hk/wxinfo/radars/R4_GIS_rad_064/$href"
          curl -A 'Mozilla/5.0' -fsSL "$image" -o /tmp/radar3.png
          file /tmp/radar3.png
          python - <<'PY'
          import struct
          for p in ['/tmp/radar3.png']:
              b=open(p,'rb').read(); w,h,depth,color,comp,filt,interlace=struct.unpack('>IIBBBBB',b[16:29])
              chunks=[]; i=8
              while i+12<=len(b):
                  n=struct.unpack('>I',b[i:i+4])[0]; typ=b[i+4:i+8].decode('latin1'); chunks.append(typ); i+=12+n
                  if typ=='IEND': break
              print({'width':w,'height':h,'bitDepth':depth,'colorType':color,'hasTRNS':'tRNS' in chunks})
          PY
