name: Recompute v1.6.2 checksums

on:
  push:
    branches:
      - feature/v1.6.2-radar-rendering-fix

permissions:
  contents: write

jobs:
  checksums:
    if: ${{ !contains(github.event.head_commit.message, 'refresh v1.6.2 checksums') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.6.2-radar-rendering-fix
      - name: Recompute listed SHA256 values
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('SHA256SUMS.txt')
          out = []
          for raw in path.read_text().splitlines():
            if not raw.strip():
              continue
            _, rel = raw.split(None, 1)
            file = Path(rel)
            digest = hashlib.sha256(file.read_bytes()).hexdigest()
            out.append(f'{digest}  {rel}')
          path.write_text('\n'.join(out) + '\n')
          PY
      - name: Commit checksums
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256SUMS.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh v1.6.2 checksums"
          git push origin HEAD:feature/v1.6.2-radar-rendering-fix
