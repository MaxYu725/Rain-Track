name: Patch v1.6.2 metadata

on:
  push:
    branches:
      - feature/v1.6.2-radar-rendering-fix

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'finalize v1.6.2 metadata') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.6.2-radar-rendering-fix
      - name: Update version metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          sw = Path('service-worker.js')
          text = sw.read_text()
          text = text.replace("point-rain-pwa-v1.6.1", "point-rain-pwa-v1.6.2")
          sw.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          text = text.replace('香港定點雨量預報 v1.6.1', '香港定點雨量預報 v1.6.2')
          index.write_text(text)
          PY
      - name: Commit metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add service-worker.js index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: finalize v1.6.2 metadata"
          git push origin HEAD:feature/v1.6.2-radar-rendering-fix
