name: Probe HKO R4 GIS radar

on:
  push:
    branches:
      - feature/v1.6.2-radar-rendering-fix

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch 64 and 256 km GIS KML
        run: |
          set -euxo pipefail
          for range in 064 256; do
            base="https://www.hko.gov.hk/wxinfo/radars/R4_GIS_rad_${range}"
            kml="$base/R4_GIS_server_Radar_${range}.kml"
            curl -fsSL "$kml?t=$(date +%s)" -o "/tmp/${range}.kml"
            python3 - "$range" <<'PY'
          import re, sys
          r=sys.argv[1]
          text=open('/tmp/'+r+'.kml').read()
          blocks=re.findall(r'<GroundOverlay\b[^>]*>(.*?)</GroundOverlay>', text, re.S|re.I)
          print('GROUND_OVERLAYS', len(blocks))
          if not blocks: raise SystemExit('no GroundOverlay')
          block=blocks[-1]
          href=re.search(r'<href>\s*(.*?)\s*</href>', block, re.S|re.I).group(1).strip()
          bounds={k:float(re.search(fr'<{k}>\s*([^<]+)', block, re.I).group(1)) for k in ('north','south','east','west')}
          when=re.search(r'<when>\s*(.*?)\s*</when>', block, re.S|re.I)
          print('LATEST_HREF', href)
          print('LATEST_WHEN', when.group(1).strip() if when else '')
          print('BOUNDS', bounds)
          open('/tmp/'+r+'.href','w').write(href)
          PY
            href=$(cat "/tmp/${range}.href")
            image="$base/$href"
            curl -fsSL "$image" -o "/tmp/${range}.png"
            echo "IMAGE=$image"
            file "/tmp/${range}.png"
            identify "/tmp/${range}.png"
            identify -format 'WIDTH=%w HEIGHT=%h CHANNELS=%[channels] TYPE=%[type]\n' "/tmp/${range}.png"
          done
